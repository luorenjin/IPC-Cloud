name: ipccloud

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ipccloud
      POSTGRES_PASSWORD: ipccloud
      POSTGRES_DB: ipccloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipccloud"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  emqx:
    image: emqx/emqx:5.7
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  zlm:
    image: zlmediakit/zlmediakit:master
    ports:
      - "8081:80"
      - "1936:1936"
      - "5544:554"
      - "30000-30100:30000-30100"
      - "30000-30100:30000-30100/udp"
    environment:
      MODE: "standalone"
    volumes:
      - zlmdata:/opt/media/bin/www/record
      - ./zlm/config.ini:/opt/media/conf/config.ini

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5060:5060/udp"
      - "5060:5060/tcp"
    environment:
      HTTP_ADDR: ":8080"
      DB_DSN: "host=postgres user=ipccloud password=ipccloud dbname=ipccloud port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "change-me-in-production"
      ENCRYPTION_KEY: "change-me-32-bytes-key-in-prod!!"
      DATA_DIR: "/app/data"
      MQTT_BROKER: "tcp://emqx:1883"
      SIP_IP: ""
      SIP_PORT: "5060"
      SIP_SERVER_ID: "34020000002000000001"
      SIP_REALM: "3402000000"
      MEDIA_DEVICE_HOST: "zlm"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "Admin@12345"
      STREAM_IDLE_SEC: "30"
    volumes:
      - serverdata:/app/data

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://server:8080
    depends_on:
      - server
    ports:
      - "3000:3000"

  simulator:
    build: ../simulator
    depends_on:
      - emqx
      - zlm
      - server
    command:
      - -mode=all
      - -broker=tcp://emqx:1883
      - -platform=http://server:8080
      - -sip-host=server
      - -sip-port=5060
      - -adv-host=simulator
      - -assets=/assets
      - -alarm-sec=90
    restart: unless-stopped

volumes:
  pgdata:
  zlmdata:
  serverdata:
