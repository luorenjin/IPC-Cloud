<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPC · 摄像机管理</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <div id="auth" class="auth">
    <div class="auth-card">
      <div class="auth-brand"><span class="logo"></span><strong>IPC</strong><em>摄像机管理</em></div>
      <h1 id="auth-h">欢迎使用</h1>
      <p class="muted" id="auth-p">请登录以管理本机</p>
      <form id="f-activate" hidden>
        <label>用户名<input value="admin" disabled></label>
        <label>设置密码<input type="password" name="p1" minlength="8" maxlength="63" placeholder="请输入8-63个字符" required></label>
        <label>确认密码<input type="password" name="p2" minlength="8" maxlength="63" required></label>
        <button class="btn primary" type="submit">激活</button>
      </form>
      <form id="f-login" hidden>
        <label>用户名<input name="u" value="admin"></label>
        <label>密码<input type="password" name="p" placeholder="请输入密码"></label>
        <button class="btn primary" type="submit">登录</button>
      </form>
      <a class="link" href="#" id="forgot">忘记密码</a>
    </div>
  </div>

  <!-- 主壳 -->
  <div id="shell" class="shell" hidden>
    <header class="top">
      <div class="brand"><span class="logo"></span><strong>IPC</strong></div>
      <nav class="topnav">
        <button type="button" data-top="preview" class="on">预览</button>
        <button type="button" data-top="tools">工具</button>
        <button type="button" data-top="settings">设置</button>
      </nav>
      <div class="topright">
        <span id="top-user">admin</span>
        <button type="button" class="tbtn" id="btn-help">帮助</button>
        <button type="button" class="tbtn" id="btn-logout">退出</button>
      </div>
    </header>
    <div id="root"></div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="js/crypto.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/views/camera.js"></script>
<script src="js/views/av.js"></script>
<script src="js/views/events.js"></script>
<script src="js/views/storage.js"></script>
<script src="js/views/network.js"></script>
<script src="js/views/system.js"></script>
<script src="js/views/modules.js"></script>
<script src="js/views/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
