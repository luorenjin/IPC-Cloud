<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPC · 摄像机管理</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 登录：结构对齐实机（44px 顶栏 + 518px 白卡 + 260px 表单列），品牌自有 -->
  <div id="auth" class="auth">
    <div class="lg-head"><span class="logo"></span><strong>IPC</strong></div>
    <div class="auth-card">
      <h1 id="auth-h">欢迎使用</h1>
      <p class="auth-err" id="auth-err" hidden></p>
      <p class="muted auth-p" id="auth-p" hidden>请登录以管理本机</p>
      <form id="f-activate" hidden>
        <div class="row">
          <label class="tip">用户名</label>
          <span class="fld user"><input value="admin" disabled placeholder="请输入用户名"></span>
        </div>
        <div class="row">
          <label class="tip" for="ac-p1">设置密码</label>
          <span class="fld pwd">
            <input id="ac-p1" type="password" name="p1" placeholder="请输入8-63字节（汉字占3字节）" required>
            <button class="eye" type="button" aria-label="显示密码" title="显示密码"><svg class="i-eye" viewBox="0 0 24 24"><path d="M1.8 12S5.7 5.6 12 5.6 22.2 12 22.2 12 18.3 18.4 12 18.4 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/></svg><svg class="i-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.7 6.2c.4-.1.9-.2 1.3-.2 6.3 0 10.2 6 10.2 6a18.4 18.4 0 0 1-3.4 4.1M6.5 7.5C3.8 9.3 1.8 12 1.8 12s3.9 6.4 10.2 6.4c1.5 0 2.9-.3 4.1-.9"/><path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3"/></svg></button>
          </span>
        </div>
        <div class="row">
          <label class="tip" for="ac-p2">确认密码</label>
          <span class="fld pwd">
            <input id="ac-p2" type="password" name="p2" placeholder="请再次输入密码" required>
            <button class="eye" type="button" aria-label="显示密码" title="显示密码"><svg class="i-eye" viewBox="0 0 24 24"><path d="M1.8 12S5.7 5.6 12 5.6 22.2 12 22.2 12 18.3 18.4 12 18.4 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/></svg><svg class="i-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.7 6.2c.4-.1.9-.2 1.3-.2 6.3 0 10.2 6 10.2 6a18.4 18.4 0 0 1-3.4 4.1M6.5 7.5C3.8 9.3 1.8 12 1.8 12s3.9 6.4 10.2 6.4c1.5 0 2.9-.3 4.1-.9"/><path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3"/></svg></button>
          </span>
        </div>
        <button class="btn primary" type="submit">激活</button>
      </form>
      <form id="f-login" hidden>
        <div class="row">
          <label class="tip" for="lg-u">用户名</label>
          <span class="fld user"><input id="lg-u" name="u" value="admin" placeholder="请输入用户名"></span>
        </div>
        <div class="row">
          <label class="tip" for="lg-p">密码</label>
          <span class="fld pwd">
            <input id="lg-p" type="password" name="p" placeholder="请输入密码">
            <button class="eye" type="button" aria-label="显示密码" title="显示密码"><svg class="i-eye" viewBox="0 0 24 24"><path d="M1.8 12S5.7 5.6 12 5.6 22.2 12 22.2 12 18.3 18.4 12 18.4 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/></svg><svg class="i-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.7 6.2c.4-.1.9-.2 1.3-.2 6.3 0 10.2 6 10.2 6a18.4 18.4 0 0 1-3.4 4.1M6.5 7.5C3.8 9.3 1.8 12 1.8 12s3.9 6.4 10.2 6.4c1.5 0 2.9-.3 4.1-.9"/><path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3"/></svg></button>
          </span>
        </div>
        <a class="link" href="#" id="forgot">忘记密码</a>
        <button class="btn primary" type="submit">登录</button>
      </form>
    </div>
  </div>

  <!-- 主壳 -->
  <div id="shell" class="shell" hidden>
    <header class="top">
      <div class="brand"><span class="logo"></span><strong>IPC</strong></div>
      <nav class="topnav">
        <button type="button" data-top="preview" class="on">预览</button>
        <button type="button" data-top="tools">工具</button>
        <button type="button" data-top="settings">设置</button>
      </nav>
      <div class="topright">
        <span id="top-user">admin</span>
        <button type="button" class="tbtn" id="btn-help">帮助</button>
        <button type="button" class="tbtn" id="btn-logout">退出</button>
      </div>
    </header>
    <div id="root"></div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="js/crypto.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/preview-player.js"></script>
<script src="js/router.js"></script>
<script src="js/views/camera.js"></script>
<script src="js/views/av.js"></script>
<script src="js/views/events.js"></script>
<script src="js/views/storage.js"></script>
<script src="js/views/network.js"></script>
<script src="js/views/system.js"></script>
<script src="js/views/modules.js"></script>
<script src="js/views/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
